schema_version: "0.5.0"
last_updated: "2026-10-27"

project:
  name: "Vortex IT · Research de audiencias e imagen"
  client: "Vortex IT"
  local_root: "."

ux:
  primary: research
  secondary: [audit, redesign]   # redesign: siguiente escenario sugerido, todavía no iniciado          # auditoría de imagen/presencia, dirigida por el research
  continuity: new
  surface: web                # web + redes (Instagram, LinkedIn, YouTube)
  client_decision: prioritize # a qué audiencias y canales priorizar
  research_mode: plan

origin:
  mode: from-scratch          # carpeta vacía; fuentes públicas como evidencia

strategy:
  current_focus: "Auditoría UI del sitio actual (sistema visual de hecho, consistencia y quiebres) como base para el futuro rediseño; el rediseño todavía no empieza."
  intervention: not-applicable
  additional_scope: []
  recommended_next:
    - "Cerrar paso 0: revisión del modelo de públicos con dirección, comercial y marketing"
    - "Relevar qué datos internos existen (CRM, analítica, métricas de redes)"
    - "Paso 3 hecho en borrador (auditoría web + análisis de comunicación); falta la prueba con asistentes de IA"
    - "Plan de mejoras preliminar (18 mejoras, 39 hallazgos, 3 etapas); revisar con Vortex y tomar las 6 decisiones pedidas"
    - "Auditoría UI hecha: siguiente paso sugerido, base del sistema visual (M18) como entrada del escenario redesign"
    - "Paso 4 benchmark: requiere lista de competidores"
    - "Revisar hallazgos de la auditoría con Vortex"
  deferred:
    - "Módulo de propuesta de diseño en el Hub: se agrega cuando exista (sin tarjeta 'próximamente')"

knowledge:
  confirmed: []
  assumptions:
    - "H1–H6 en modules/documentation/research/encuadre.md"
    - "Orden preliminar de públicos en modules/documentation/research/modelo-de-publicos.md (sección 5)"
  open_questions:
    - "Qué datos internos existen y se pueden compartir"
    - "Quiénes participan en entrevistas internas"
    - "Objetivo comercial prioritario (industria, país, servicio o plataforma)"
    - "Competidores de referencia"
    - "Foco sectorial real (banca/retail/fintech en metadatos vs contenido visible)"
    - "Qué casos de clientes se pueden mostrar"
    - "Rol de plataformas y blog frente al mensaje principal"
    - "Existencia de documentación legal y de privacidad"
    - "Ficha oficial de Vortex: cifras de personal, líneas de servicio (4 en la web, 5 en LinkedIn), sectores y sedes"
    - "Métricas de LinkedIn, Instagram y YouTube"
    - "Respuestas de asistentes de IA (prueba manual, ver análisis de comunicación, sección 7)"
  superseded:
    - item: "Encuadre v1 basado en la web e Instagram actuales (00-encuadre-y-plan.md)"
      replaced_by: "01-encuadre.md: modelo general de públicos primero, la web como objeto de evaluación"
      date: "2026-10-26"
      source: user

decisions:
  - decision: "Escenario principal research (modo plan), auditoría de imagen como secundaria posterior"
    basis: deduced
    date: "2026-10-26"
  - decision: "Partir de un modelo general de públicos (no de la web actual) para evitar sesgo"
    basis: user
    date: "2026-10-26"
  - decision: "Propósito 'crear confianza' operacionalizado por público: qué necesita para confiar y cuál es su siguiente paso"
    basis: user
    date: "2026-10-26"
  - decision: "Entrega directa por ahora; estructura preparada para Hub"
    basis: recommended-default
    date: "2026-10-26"
    superseded_by: "Hub orientado a UX Research"
  - decision: "Entrega por Hub, orientado a UX Research; se sumará un módulo de diseño más adelante"
    basis: user
    date: "2026-10-26"
  - decision: "Hub estático en la raíz, sin build; los .md son la fuente y el módulo Research los muestra con un visor propio"
    basis: recommended-default
    date: "2026-10-26"
  - decision: "El Hub usa la identidad visual actual de vortex-it.com (verde #A0D232, violetas, fondo oscuro, Rubik), sólo en modo oscuro"
    basis: user
    date: "2026-10-26"
  - decision: "Los estilos del Hub (assets/hub-tokens.css, assets/ESTILO-HUB.md) son sólo del Hub; no son base de la futura propuesta de diseño, que tendrá sus propios tokens y módulo aislado"
    basis: user
    date: "2026-10-26"

  - decision: "El Hub tiene dos módulos conectados: UX Research (síntesis humanizada para cliente/ejecutivo) y Documentación (fuente detallada, spec/data-driven, legible por IA). Ante diferencias manda Documentación"
    basis: user
    date: "2026-10-26"
  - decision: "Navegación sintética: las tarjetas (Hub y submódulos de Research) muestran sólo ícono, título, descripción y estado; las aclaraciones van dentro de cada módulo"
    basis: user
    date: "2026-10-26"
  - decision: "Submódulos de Research: plan, públicos, negocio, auditoría web, comunicación, benchmark, validación, conclusiones. Los pendientes muestran qué se va a responder y cómo (destino real, no 'próximamente')"
    basis: recommended-default
    date: "2026-10-26"
  - decision: "Documentación en Markdown con metadatos (id, type, status, evidence, updated, depends_on, feeds); datos estructurados futuros en data/"
    basis: recommended-default
    date: "2026-10-26"
  - decision: "Usar el logo de Vortex en el Hub (assets/brand/vortex-logo.svg, tomado de vortex-it.com)"
    basis: user
    date: "2026-10-26"
  - decision: "Documentación se presenta como lista de documentos con buscador en el contenido; el documento se abre aparte, sin barra lateral"
    basis: user
    date: "2026-10-26"
  - decision: "Versionar el Hub en github.com/Marcolof/auditoria-web-vortex (rama main) y preparar despliegue estático en Vercel"
    basis: user
    date: "2026-10-26"
  - decision: "Hub publicado con X-Robots-Tag noindex (no indexable por buscadores)"
    basis: recommended-default
    date: "2026-10-26"
  - decision: "Auditoría web como revisión experta (heurísticas de Nielsen, dimensiones de confianza y necesidades comunes del modelo de públicos), severidad 0–4, sin usuarios reales; hallazgos sin nombres de personas"
    basis: recommended-default
    date: "2026-10-26"
  - decision: "Análisis de comunicación sobre perfiles públicos (LinkedIn, YouTube, Instagram) y búsqueda web; asistentes de IA de consumo quedan como prueba manual pendiente; sin nombres de personas en los entregables"
    basis: recommended-default
    date: "2026-10-26"
  - decision: "Foco del research en la web: qué debería mostrar para cada público. Entregable de contenido (hipótesis), no de diseño; las opciones de mensaje se arman sólo con lo que Vortex ya dice y se prueban en el paso 6"
    basis: user
    date: "2026-10-26"
  - decision: "Reporte de mejoras de la web: 14 mejoras en tres etapas que cubren los 17 hallazgos (3 mayores, 12 menores, 2 cosméticos); preliminar hasta validar con personas (paso 6)"
    basis: user
    date: "2026-10-26"
  - decision: "Análisis visual y prueba de usabilidad simulada hechos por IA (Claude) sobre el sitio publicado: hipótesis, no evidencia de usuarios; las 9 tareas se reutilizan en el test real"
    basis: user
    date: "2026-10-26"
  - decision: "Plan de mejoras actualizado a 26 hallazgos y 16 mejoras (suma V1–V6 y U1–U3); H10 anotado como no reproducido"
    basis: recommended-default
    date: "2026-10-26"
  - decision: "Valoración subjetiva del atractivo agregada al análisis visual (puntaje 1–5 por dimensión, opinión del revisor IA) con medición de imágenes y scroll; suma V7–V9 y M17 al plan (29 hallazgos, 17 mejoras)"
    basis: user
    date: "2026-10-26"
  - decision: "Submódulo 'Estado del research' como primera tarjeta de Research; Plan del research remite a él para no duplicar el avance"
    basis: user
    date: "2026-10-26"
  - decision: "Auditoría UI del sitio actual (sólo diagnóstico, sin propuesta): sistema de hecho, inventario de componentes, estados y responsive; formato texto y datos medidos, sin capturas guardadas ni Figma"
    basis: user
    date: "2026-10-27"
  - decision: "Plan de mejoras actualizado a 39 hallazgos y 18 mejoras: suma UI1–UI10 y M18 (sistema visual base); UI6 y UI3 refuerzan M15; UI7 se suma a M4"
    basis: recommended-default
    date: "2026-10-27"
  - decision: "En Research, lo visual y la auditoría UI se unifican en 'Diseño visual y UI' (?m=visual-ui) y la usabilidad simulada queda aparte (?m=usabilidad). En Documentación siguen como documentos separados (analisis-visual, auditoria-ui, usabilidad-simulada). Los ids viejos redirigen vía 'redirecciones' en modulos.json"
    basis: user
    date: "2026-10-27"
  - decision: "Revisión de todos los submódulos de Research: coherencia de enlaces, datos y textos; Hallazgos y recomendaciones reescrito con origen de los 39 hallazgos, 5 mejoras principales (suma legibilidad/recorrido y sistema visual) y paso 4 en Qué sigue; paso 6 del roadmap suma el test de tareas T1–T9"
    basis: user
    date: "2026-10-27"
  - decision: "Consolidación de hallazgos: de 39 a 28 vigentes (3 mayores, 19 menores, 6 cosméticos). Fusionados H3→C1, V2→UI3, U1→H11, UI2/UI5/UI9/UI10→UI1, UI7→H8, UI8→UI3+UI4; H10 y H12 pasan a dudas a verificar (M5). Los ids fusionados no se reutilizan y se conservan marcados en su documento"
    basis: user
    date: "2026-10-27"
  - decision: "Acceso 'Ver hallazgos' (clase md-action en assets/md-base.css) en Hallazgos y recomendaciones y en Estado, hacia la sección 4 del plan de mejoras, donde cada hallazgo enlaza a su detalle"
    basis: user
    date: "2026-10-27"

sources:
  - id: web
    url: "https://vortex-it.com/"
    type: public-website
    reviewed_at: "2026-10-26"
    scope: "home, /hablemos"
  - id: instagram-reel
    url: "https://www.instagram.com/vortex.it/reel/Dbs104DxJxL/"
    type: social
    reviewed_at: "2026-10-26"
    scope: "texto del reel (sin sesión)"
  - id: web-audit-snapshot
    url: "https://vortex-it.com/"
    type: public-website
    reviewed_at: "2026-10-26"
    scope: "9 páginas ES/EN: inicio, soluciones, cómo trabajamos, sobre, plataformas, blog, hablemos, trabajá con nosotros, /en/; metadatos, hreflang, robots.txt, sitemap.xml; hero en mobile emulado"
    not_covered: "LinkedIn, YouTube, Instagram, sitios de plataformas, teclado, lectores de pantalla, dispositivos reales, analítica"
  - id: comms-snapshot
    type: public-channels
    reviewed_at: "2026-10-26"
    urls: ["https://www.linkedin.com/company/vortex-it-ok", "https://www.youtube.com/@vortexit", "https://www.instagram.com/vortex.it/"]
    scope: "página de empresa de LinkedIn (7 ítems recientes), canal de YouTube (17 videos), perfil de Instagram (sin sesión), 3 búsquedas web"
    not_covered: "métricas, contenido de Instagram, historial de LinkedIn, asistentes de IA de consumo"
  - id: logo
    url: "https://vortex-it.com/assets/Logo%20VX_blanco%20y%20violeta.svg"
    type: brand-asset
    retrieved_at: "2026-10-26"
    local_copy: assets/brand/vortex-logo.svg
    note: "SVG revisado: sin scripts ni referencias externas"
  - id: ui-audit-snapshot
    url: "https://vortex-it.com/"
    type: public-website
    reviewed_at: "2026-10-27"
    scope: "8 páginas ES (inicio, soluciones, cómo trabajamos, sobre, plataformas, blog, hablemos, trabajá con nosotros); reglas CSS declaradas y estilos calculados a 1280×800 y 375×812; capturas de secciones"
    not_covered: "envío y errores de formulario, teclado completo, lector de pantalla, versión EN, anchos intermedios"

delivery:
  mode: hub
  primary_artifact: index.html
  local_status: local-verified
  repository: "https://github.com/Marcolof/auditoria-web-vortex"
  repository_visibility: public
  repository_status: local-changes   # último push 7471488/e1befad en main; revisión de submódulos, consolidación de hallazgos y "Ver hallazgos" sin subir
  branch: main
  deploy_target: vercel        # proyecto Vercel a crear por el usuario e importar desde el repo
  deploy_config: "vercel.json + .vercelignore; estático, sin build ni variables de entorno"
  status: local-only
  last_verified: "2026-10-27"

architecture:
  build_root: "."
  build: none                 # HTML estático; requiere servidor HTTP para leer los .md (no funciona con file://)
  local_server: ".claude/launch.json → python -m http.server 8765"
  hub_route: "/"              # index.html + assets/hub.css
  deep_linking:
    research: "modules/research/?m=<id>#<ancla>"
    documentation: "modules/documentation/?doc=<ruta.md>[&q=<búsqueda>]#<ancla> · lista: modules/documentation/?q=<búsqueda>"
  module_style_isolation: required   # hub: assets/hub.css · research: modules/research/_view/ (scope body.rs)
  shared_layer: "assets/hub-tokens.css — tokens del Hub para el Hub y módulos documentales; un módulo de diseño NO lo importa"
  hub_style_reference: modules/documentation/proyecto/estilo-hub.md
  shared_viewer: "assets/md-viewer.js + assets/md-base.css — motor común para mostrar Markdown; cada módulo pone layout y estilos propios"
  external_dependencies:
    - "marked 12.0.2 (cdnjs) para renderizar Markdown en el visor de Research"
    - "Rubik (Google Fonts)"

capabilities: {}
tools:
  python:
    status: ready
    checked_at: "2026-10-26"
  browser:
    status: ready
    checked_at: "2026-10-26"

modules:
  hub:
    path: index.html
    status: draft
    verification: local-verified
    cards: [research, documentation]
  research:
    path: modules/research
    purpose: "Síntesis para cliente y ejecutivos"
    landing: modules/research/index.html
    manifest: modules/research/modulos.json   # fuente de tarjetas y estados de submódulos
    view_assets: modules/research/_view/
    children:
      - { id: research-estado, path: modules/research/estado.md, audience: client, status: review, freshness: current, evidence: observed, verification: content-reviewed, depends_on: [research-conclusiones, research.roadmap], note: "resumen de estado; actualizar con cada avance" }
      - { id: research-plan, path: modules/research/plan.md, audience: client, status: review, freshness: current, evidence: assumption, verification: content-reviewed, depends_on: [research.encuadre, research.roadmap] }
      - { id: research-publicos, path: modules/research/publicos.md, audience: client, status: review, freshness: current, evidence: assumption, verification: content-reviewed, depends_on: [research.modelo-de-publicos] }
      - { id: research-negocio, path: modules/research/negocio.md, audience: client, status: draft, freshness: current, evidence: none, verification: content-reviewed, note: "plan del submódulo; sin hallazgos" }
      - { id: research-auditoria-web, path: modules/research/auditoria-web.md, audience: client, status: review, freshness: current, evidence: observed, verification: content-reviewed, depends_on: [research.auditoria-web], note: "revisión experta sin usuarios; alcance sólo vortex-it.com" }
      - { id: research-visual-ui, path: modules/research/visual-ui.md, audience: client, status: review, freshness: current, evidence: observed, verification: content-reviewed, depends_on: [research.analisis-visual, research.auditoria-ui], note: "une revisión visual (atractivo) y auditoría UI (sistema); hecho por IA, sin personas; reemplaza visual-usabilidad y auditoria-ui" }
      - { id: research-usabilidad, path: modules/research/usabilidad.md, audience: client, status: review, freshness: current, evidence: assumption, verification: content-reviewed, depends_on: [research.usabilidad-simulada], note: "simulación con IA; sin personas" }
      - { id: research-comunicacion, path: modules/research/comunicacion.md, audience: client, status: review, freshness: current, evidence: observed, verification: content-reviewed, depends_on: [research.analisis-comunicacion], note: "perfiles públicos sin sesión; sin métricas; asistentes de IA no consultados" }
      - { id: research-contenido-web, path: modules/research/contenido-web.md, audience: client, status: review, freshness: current, evidence: assumption, verification: content-reviewed, depends_on: [research.web-que-mostrar], note: "propuesta de contenido; hipótesis; sin diseño ni textos finales" }
      - { id: research-benchmark, path: modules/research/benchmark.md, audience: client, status: draft, freshness: current, evidence: none, verification: content-reviewed, note: "plan del submódulo; sin hallazgos" }
      - { id: research-validacion, path: modules/research/validacion.md, audience: client, status: draft, freshness: current, evidence: none, verification: content-reviewed, note: "plan del submódulo; sin hallazgos" }
      - { id: research-conclusiones, path: modules/research/conclusiones.md, audience: client, status: review, freshness: current, evidence: observed, verification: content-reviewed, depends_on: [research.plan-de-mejoras-web], note: "versión preliminar: hallazgos observados; prioridad, impacto y esfuerzo son juicio experto, sin validar con usuarios" }
  documentation:
    path: modules/documentation
    purpose: "Fuente detallada, spec/data-driven, legible por IA"
    landing: modules/documentation/index.html   # lista de documentos (sale de las tablas de README.md) + búsqueda en el contenido
    search: "client-side sobre todos los .md listados en README; sin tildes ni mayúsculas; ?q= en la URL; resalta coincidencias al abrir el documento"
    canonical_source: "modules/documentation/**/*.md"
    view_assets: modules/documentation/_view/
    children:
      - { id: research.encuadre, path: modules/documentation/research/encuadre.md, audience: internal, provider: fallback, status: draft, freshness: current, evidence: assumption, verification: content-reviewed }
      - { id: research.roadmap, path: modules/documentation/research/roadmap.md, audience: internal, provider: fallback, status: draft, freshness: current, evidence: none, verification: content-reviewed }
      - { id: research.modelo-de-publicos, path: modules/documentation/research/modelo-de-publicos.md, audience: internal, provider: fallback, status: review, freshness: current, evidence: assumption, verification: content-reviewed }
      - { id: research.encuadre-v1, path: modules/documentation/research/archivo/encuadre-v1.md, audience: internal, status: superseded, freshness: stale, stale_reason: "Reemplazado por research.encuadre", evidence: observed }
      - { id: research.auditoria-web, path: modules/documentation/research/auditoria-web.md, audience: internal, provider: fallback, status: draft, freshness: current, evidence: observed, verification: content-reviewed, depends_on: [research.modelo-de-publicos] }
      - { id: research.analisis-comunicacion, path: modules/documentation/research/analisis-comunicacion.md, audience: internal, provider: fallback, status: draft, freshness: current, evidence: observed, verification: content-reviewed, depends_on: [research.modelo-de-publicos, research.auditoria-web] }
      - { id: research.web-que-mostrar, path: modules/documentation/research/web-que-mostrar.md, audience: internal, provider: fallback, status: draft, freshness: current, evidence: assumption, verification: content-reviewed, depends_on: [research.modelo-de-publicos, research.auditoria-web, research.analisis-comunicacion] }
      - { id: research.plan-de-mejoras-web, path: modules/documentation/research/plan-de-mejoras-web.md, audience: internal, provider: fallback, status: draft, freshness: current, evidence: observed, verification: content-reviewed, depends_on: [research.auditoria-web, research.analisis-comunicacion, research.web-que-mostrar] }
      - { id: research.analisis-visual, path: modules/documentation/research/analisis-visual.md, audience: internal, provider: fallback, status: draft, freshness: current, evidence: observed, verification: content-reviewed, depends_on: [research.auditoria-web] }
      - { id: research.usabilidad-simulada, path: modules/documentation/research/usabilidad-simulada.md, audience: internal, provider: fallback, status: draft, freshness: current, evidence: assumption, verification: content-reviewed, depends_on: [research.modelo-de-publicos, research.auditoria-web], note: "simulación con IA; no es evidencia de usuarios; tareas reutilizables en el paso 6" }
      - { id: research.auditoria-ui, path: modules/documentation/research/auditoria-ui.md, audience: internal, provider: fallback, status: draft, freshness: current, evidence: observed, verification: content-reviewed, depends_on: [research.analisis-visual, research.auditoria-web], note: "línea de base del sistema visual para M18 y el rediseño" }
      - { id: proyecto.estilo-hub, path: modules/documentation/proyecto/estilo-hub.md, audience: internal, status: draft, freshness: current, evidence: observed }
  retired_routes:
    - "modules/research/?doc=… → reemplazado por modules/documentation/?doc=research/… (2026-10-26)"
    - "modules/research/?m=visual-usabilidad y ?m=auditoria-ui → ?m=visual-ui (redirección en el visor, 2026-10-27); la usabilidad pasa a ?m=usabilidad"

figma:
  status: none
  source: none
  sync: not-required-yet

design_system:
  status: none
  source: null
